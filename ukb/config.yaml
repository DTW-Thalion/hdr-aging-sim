# ===========================================================
#  HDR UK Biobank Analysis — Configuration
#  Edit the paths and field mappings below to match your data.
# ===========================================================

# --- Data paths ---
# The main participant data file (CSV or Parquet exported from UKB).
# Must contain columns named by UK Biobank field IDs (e.g., "30710-0.0" for
# CRP at instance 0, array 0) OR use the melted/long basket format with
# columns: eid, field_id, instance, array_index, value.
data_path: "/path/to/ukb_participant_data.csv"
data_format: "csv"          # "csv", "parquet", or "feather"

# Withdrawal list (one eid per line). Participants on this list are excluded.
# Set to null if no withdrawal list is available.
withdrawal_path: null

# Mortality/outcome data (if separate file; often linked in main data).
# Set mortality_path to null if death fields are in the main data file.
mortality_path: null
death_date_field: "40000-0.0"    # Date of death
death_cause_field: "40001-0.0"   # Primary cause of death (ICD-10)
censor_date: "2023-12-31"        # Administrative censoring date (edit to match your data release)

# Hospital Episode Statistics (optional — for hospitalisation outcome).
hes_path: null

# Accelerometry data (optional — for circadian axis).
# Set to null if not available; step8 will be skipped.
accel_summary_path: null
accel_raw_dir: null

# DXA data (optional — for bone axis).
# Set to null if not available.
dxa_path: null

# Output directory
output_dir: "./results"

# J-matrix CSV (compiled from HDR manuscript). Bundled with this package.
j_matrix_path: "./J_matrix_compiled_9x9.csv"

# Optional chunked processing (set chunk_size > 0 to enable chunked CSV reads).
chunk_size: 0

# --- UK Biobank Field ID Mappings ---
# Format: "field_id-instance.array" (e.g., "30710-0.0" = CRP, instance 0, array 0)
# In config entries below we give only the bare field_id — the extraction script
# resolves the per-instance column names automatically.

eid_field: "eid"

# Demographics
age_field: "21003"          # Age at recruitment (instance 0 only)
birth_year_field: "34"      # Year of birth (used to compute age at other instances)
birth_month_field: "52"     # Month of birth
sex_field: "31"             # Sex (0=female, 1=male)
assessment_date_field: "53" # Date of assessment
ethnicity_field: "21000"
smoking_field: "20116"      # Smoking status (0=never, 1=previous, 2=current)
townsend_field: "189"       # Townsend deprivation index

# Instances available (assessment visits):
#   instance 0 = initial assessment (2006-2010, N ~500K)
#   instance 1 = first repeat assessment (2012-2013, N ~20K)
#   instance 2 = imaging assessment (2014-2020, N ~100K)
#   instance 3 = repeat imaging (2019+, N ~60K)
instances: [0, 2]           # Which instances to use for longitudinal analysis

# --- Axis biomarker fields ---
# Each axis lists primary and fallback biomarker field IDs.

axis_I:                     # Inflammatory resolution
  primary: "30710"          # CRP (mg/L)
  transform: "log"
  sign: "positive"          # higher = worse
  fallback: null

axis_M:                     # Metabolic gain
  primary: "30750"          # HbA1c (mmol/mol)
  transform: "none"
  sign: "positive"
  fallback: "30740"         # Glucose (mmol/L) — fallback
  glucose_field: "30740"    # used for HOMA-IR
  insulin_field: "30820"    # Insulin (if available, usually not in main data)
  bmi_field: "21001"
  composite: null           # set to ["30750", "21001"] for HbA1c+BMI composite

axis_F:                     # Skeletal muscle balance
  primary: "46"             # Hand grip strength (kg) — left
  grip_left: "46"
  grip_right: "47"
  transform: "none"
  sign: "negative"          # lower = worse (sign-flip applied)
  fallback: null

axis_N:                     # Neuroautonomic balance
  primary: "102"            # Pulse rate (bpm)
  transform: "none"
  sign: "positive"
  fallback: null
  sbp_field: "4080"
  dbp_field: "4079"

axis_C:                     # Circadian fidelity (requires accelerometry)
  sleep_duration: "1160"
  chronotype: "1180"
  accel_overall: "90012"    # Overall average acceleration (mg)
  accel_moderate: "90087"
  accel_RA_field: null      # relative amplitude (populated by step8)
  accel_IV_field: null      # intradaily variability
  accel_IS_field: null      # interdaily stability
  transform: "none"
  sign: "positive"          # higher fragmentation = worse

axis_B:                     # Bone remodeling balance (requires DXA)
  femoral_neck_bmd: "78"    # Heel BMD — substitute with DXA field if available
  total_hip_bmd: null
  lumbar_bmd: null
  heel_bmd: "78"
  transform: "none"
  sign: "negative"          # lower BMD = worse

axis_P:                     # Proteostatic clearance (proxy)
  primary: "30720"          # Cystatin C (mg/L)
  transform: "log"
  sign: "positive"
  fallback: null

# --- Medication fields ---
medications:
  medication_women: "6153"
  medication_men:   "6177"
  insulin_use:      "2986"
  # UKB coding 100626 (women field 6153):
  #   1 = cholesterol-lowering, 2 = blood pressure, 3 = insulin,
  #   4 = HRT, 5 = oral contraceptive, -7 = none, -1/-3 = missing
  # UKB coding 100625 (men field 6177):
  #   1 = cholesterol-lowering, 2 = blood pressure, 3 = insulin,
  #   -7 = none, -1/-3 = missing

# --- Comorbidity fields ---
comorbidities:
  diabetes_diagnosed:    "2443"
  vascular_heart:        "6150"   # coded: 1=heart attack, 2=angina, 3=stroke, 4=hypertension, -7=none
  clot_dvt:              "6152"
  cancer_diagnosed:      "2453"

# --- Frailty Index components ---
# Rockwood-style FI built from binary deficits + functional measures.
fi_fields:
  - "2443"     # diabetes
  - "6150"     # vascular / heart
  - "6152"     # blood clot / DVT
  - "2453"     # cancer
  - "1220"     # long-standing illness
  - "2178"     # overall health rating
  - "924"      # usual walking pace
  - "46"       # grip strength (for weakness criterion, sex-specific cutoffs)
  - "47"       # grip strength other hand
  - "864"      # days/week moderate activity
  - "884"      # days/week vigorous activity
  - "2188"     # long-standing illness / disability / infirmity
  - "1180"     # morning/evening (not a deficit — placeholder)

# --- Analysis parameters ---
analysis:
  age_strata:
    - [40, 49]
    - [50, 59]
    - [60, 69]
    - [70, 79]
    - [80, 100]
  youthful_reference_age: [40, 49]
  n_bootstrap: 10000          # λ_max CIs
  n_bootstrap_cox: 2000       # ΔC CIs (slower)
  n_permutations: 1000        # permutation nulls
  n_random_panels: 500        # random-biomarker-panel null
  fdr_alpha: 0.05
  delta_c_threshold: 0.01
  seed: 42

  # Model tiers — feasibility is auto-detected at run time.
  tier1_axes: ["I", "M", "F"]                     # minimum (replicates ELSA)
  tier2_axes: ["I", "M", "F", "N"]                # adds N (replicates InCHIANTI)
  tier3_axes: ["I", "M", "F", "N", "C"]           # adds C (requires accelerometry)
  tier4_axes: ["I", "M", "F", "N", "C", "B"]      # adds B (requires DXA)

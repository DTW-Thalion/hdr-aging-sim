[project]
name = "hdr-aging-sim"
version = "0.2.0"
description = "HDR aging dynamics simulation: 4-axis toy model + 9-axis mechanistic-evidence framework with two-timescale decomposition"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
]

[project.optional-dependencies]
nhanes = ["pandas", "pyreadstat"]
elsa = ["lifelines>=0.27"]
dev = ["pytest"]
part2 = ["lifelines>=0.27"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
